# Compose untuk server Ubuntu, diakses lewat http://IP_SERVER:8080.
# Jalankan dengan:  docker compose -f docker-compose.server.yml up -d --build
#
# Nama project sengaja beda dari docker-compose.yml agar container dan volume
# lokal tidak bertabrakan bila file ini ikut ter-clone di mesin developer.
name: silakes-server

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: silakes:server
    restart: unless-stopped
    ports:
      # Bind ke semua interface karena akses memakai IP server langsung.
      # Batasi dengan firewall di sisi server, bukan dengan binding di sini.
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: SILAKES
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?APP_KEY wajib diisi di .env}"
      APP_URL: "${APP_URL:?APP_URL wajib diisi, contoh http://203.0.113.10:8080}"
      APP_LOCALE: id
      APP_FALLBACK_LOCALE: en
      APP_TIMEZONE: Asia/Jakarta
      BCRYPT_ROUNDS: "12"

      LOG_CHANNEL: stderr
      LOG_LEVEL: warning

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-silakes}"
      DB_USERNAME: "${DB_USERNAME:-silakes}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}"

      SESSION_DRIVER: database
      SESSION_LIFETIME: "120"
      # Akses memakai http, jadi cookie tidak boleh secure.
      # Ubah ke "true" begitu HTTPS terpasang.
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-false}"

      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      FILESYSTEM_DISK: local

      RUN_MIGRATIONS: "true"
      SEED_ON_START: "${SEED_ON_START:-false}"
    volumes:
      - silakes-server-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 10s

  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-silakes}"
      MYSQL_USER: "${DB_USERNAME:-silakes}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD wajib diisi di .env}"
    volumes:
      - silakes-server-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  silakes-server-db:
  silakes-server-storage: