name: silakes

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: silakes:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: SILAKES
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:-}"
      APP_URL: "http://localhost:${APP_PORT:-8080}"
      APP_LOCALE: id
      APP_FALLBACK_LOCALE: en
      APP_TIMEZONE: Asia/Jakarta
      BCRYPT_ROUNDS: "12"

      LOG_CHANNEL: stderr
      LOG_LEVEL: warning

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: silakes
      DB_USERNAME: silakes
      DB_PASSWORD: silakes

      SESSION_DRIVER: database
      SESSION_LIFETIME: "120"
      SESSION_SECURE_COOKIE: "false"

      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
      FILESYSTEM_DISK: local

      RUN_MIGRATIONS: "true"
      SEED_ON_START: "false"
    volumes:
      - silakes-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    stop_grace_period: 10s

  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: silakes
      MYSQL_USER: silakes
      MYSQL_PASSWORD: silakes
      MYSQL_ROOT_PASSWORD: silakes-root
    volumes:
      - silakes-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  silakes-db:
  silakes-storage: