[www]
listen = 127.0.0.1:9000

user = www-data
group = www-data

; Agar variabel environment dari docker compose sampai ke Laravel.
clear_env = no

pm = dynamic
pm.max_children = 25
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2